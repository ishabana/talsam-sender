[env:thmi]
platform = espressif32@6.9.0
board = esp32s3box
framework = arduino
upload_port = COM10
monitor_port = COM10
upload_speed = 921600
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.embed_files = data/wafq.tgz  ; built by `npm run dist` in pc/
board_build.embed_txtfiles =
    data/wafq-client.ps1
    data/wafq.cmd
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
